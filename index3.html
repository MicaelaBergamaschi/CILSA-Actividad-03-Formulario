<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulario de Datos Personales</title>
    <link rel="stylesheet" href="../Styles/styles.css" type="text/css" />
  </head>
  <body>
    <div class="container" id="page">
      <h1>Formulario de Datos Personales</h1>
      <form id="form-datos" novalidate action="index3.html" method="post">
        <div class="form-group">
          <label for="nombre">Nombre: *</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            required
            minlength="2"
            placeholder="Juan"
            pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$"
            aria-describedby="error-nombre"
            aria-invalid="false"
          />
          <span class="error-msg" id="error-nombre" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="apellido">Apellido: *</label>
          <input
            type="text"
            id="apellido"
            name="apellido"
            required
            minlength="2"
            placeholder="Pérez"
            pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$"
          />
          <span class="error-msg" id="error-apellido"></span>
        </div>

        <div class="form-group">
          <label for="email">Email: *</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="usuario@ejemplo.com"
          />
          <span class="error-msg" id="error-email"></span>
        </div>

        <div class="form-group">
          <label for="fechaNacimiento">Fecha de nacimiento: *</label>
          <input
            type="date"
            id="fechaNacimiento"
            name="fechaNacimiento"
            required
            min="1900-01-01"
          />
          <span class="error-msg" id="error-fecha"></span>
        </div>

        <div class="form-group">
          <label for="pais">País de residencia: *</label>
          <select id="pais" name="pais" required>
            <option value="">--Seleccionar--</option>
            <option value="AR">Argentina</option>
            <option value="CL">Chile</option>
            <option value="UY">Uruguay</option>
            <option value="ES">España</option>
            <option value="OTRO">Otro</option>
          </select>
          <span class="error-msg" id="error-pais"></span>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">Enviar</button>
          <button
            type="button"
            id="btn-toggle-constraste"
            class="btn btn-secondary"
          >
            Activar Alto Constraste
          </button>
        </div>
      </form>
    </div>
  </body>

  <script src="script3.js" type="text/javascript"></script>
</html>
